<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1220">
<title>اتاق ذهن | Mind Room</title>
<style>
:root{--bg:#0B1220;--s:#151E32;--s2:#1C2842;--b:#2A3854;--t:#E8EEF7;--m:#94A3B8;--p:#38BDF8;--a:#A78BFA;--ok:#10B981;--wn:#F59E0B;--dg:#EF4444;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.85;font-size:15px;margin:0;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:20px 16px 120px;min-height:100vh}
h1{font-size:1.4rem;font-weight:700;margin:0 0 6px;color:var(--p)}
h2{font-size:1.1rem;font-weight:700;margin:0 0 10px}
h3{font-size:1rem;font-weight:700;margin:0 0 8px;color:var(--p)}
p{margin:0 0 12px}
.m{color:var(--m);font-size:.88rem}
.q{font-size:1.15rem;font-weight:600;margin:0 0 18px;line-height:1.8;color:var(--t)}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.c{cursor:pointer;transition:all .2s}
.card.c:active{transform:scale(.99);background:var(--s2)}
.card h4{margin:0 0 6px;font-size:.98rem}
.card p{margin:0;font-size:.86rem;color:var(--m);line-height:1.7}
.big-choice{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(135deg,var(--s),var(--s2));border:1.5px solid var(--b);border-radius:var(--r);cursor:pointer;text-align:right;width:100%;font-family:inherit;color:var(--t);font-size:1.02rem;margin-bottom:12px;font-weight:600}
.big-choice:active{transform:scale(.98)}
.big-choice .e{font-size:1.8rem;flex-shrink:0;width:40px;text-align:center}
.ib{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--s);border:1px solid var(--b);border-radius:14px;cursor:pointer;text-align:right;width:100%;font-family:inherit;color:var(--t);font-size:.95rem;margin-bottom:10px}
.ib:active{background:var(--s2)}
.ib .e{font-size:1.5rem;flex-shrink:0;width:32px;text-align:center}
.ib .l{flex:1;font-weight:500}
.ib .ch{color:var(--m)}
.tag{display:inline-block;padding:2px 10px;border-radius:100px;font-size:.72rem;font-weight:600;background:rgba(56,189,248,.15);color:var(--p);margin-left:6px;margin-bottom:4px}
.tag.g{background:rgba(16,185,129,.15);color:var(--ok)}
.tag.o{background:rgba(245,158,11,.15);color:var(--wn)}
.tag.r{background:rgba(239,68,68,.15);color:var(--dg)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:10px}
.bp{background:var(--p);color:#0B1220}
.bs{background:var(--s2);color:var(--p);border:1px solid var(--b)}
.btn:disabled{opacity:.4}
.back{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;color:var(--m);font-family:inherit;font-size:.9rem;cursor:pointer;padding:8px 0;margin-bottom:14px}
.dis{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.35);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.82rem;color:#C4B5FD;line-height:1.7}
.warn{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.85rem;color:#FCA5A5}
.pg{height:4px;background:var(--s2);border-radius:100px;overflow:hidden;margin:6px 0 18px}
.pgb{height:100%;background:linear-gradient(90deg,var(--p),var(--a));transition:width .3s}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{padding:14px 16px;background:var(--s);border:1.5px solid var(--b);border-radius:12px;color:var(--t);font-family:inherit;font-size:.93rem;cursor:pointer;text-align:right;font-weight:500}
.opt:active{background:var(--s2)}
.opt.sel{background:rgba(56,189,248,.12);border-color:var(--p);color:var(--p)}
.sh{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(167,139,250,.1));border:1px solid rgba(56,189,248,.35);border-radius:20px;padding:26px;text-align:center;margin-bottom:16px}
.sh .n{font-size:3rem;font-weight:800;color:var(--p);line-height:1}
.sh .l{font-size:1.05rem;font-weight:700;margin-top:10px;line-height:1.6}
.comment{text-align:center;color:var(--a);font-size:.85rem;margin:14px 0;font-style:italic;opacity:.85}
.bn{position:fixed;bottom:0;left:0;right:0;background:rgba(21,30,50,.97);backdrop-filter:blur(12px);border-top:1px solid var(--b);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.bni{max-width:520px;margin:0 auto;display:flex;justify-content:space-around}
.nv{flex:1;background:none;border:none;color:var(--m);font-family:inherit;font-size:.68rem;cursor:pointer;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nv .i{font-size:1.3rem}
.nv.a{color:var(--p)}
.ta{width:100%;min-height:90px;padding:12px;background:var(--s2);border:1.5px solid var(--b);border-radius:12px;color:var(--t);font-family:inherit;font-size:.9rem;line-height:1.7;resize:vertical}
.ta:focus{outline:none;border-color:var(--p)}
.stp{display:flex;gap:12px;align-items:flex-start;background:var(--s);border-radius:12px;padding:14px;margin-bottom:10px}
.stp .n{background:var(--p);color:#0B1220;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.section{padding:6px 0}
.stat{flex:1;background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:1.3rem;font-weight:800;color:var(--p)}
.stat .t{font-size:.72rem;color:var(--m);margin-top:2px}
.sr{display:flex;gap:8px;margin-bottom:12px}
.acc{background:var(--s);border:1px solid var(--b);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc summary{padding:14px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:'▾';color:var(--m)}
.acc .bd{padding:0 16px 16px;font-size:.9rem;color:var(--m);line-height:1.85}
.player{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(167,139,250,.1));border:1px solid rgba(56,189,248,.35);border-radius:20px;padding:24px;text-align:center;margin-bottom:16px}
.player .play-btn{width:80px;height:80px;border-radius:50%;background:var(--p);color:#0B1220;border:none;font-size:2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 30px rgba(56,189,248,.4)}
.player .play-btn:active{transform:scale(.95)}
.player .track-name{font-weight:700;font-size:1.05rem;margin-bottom:4px}
.player .track-desc{color:var(--m);font-size:.85rem;margin-bottom:14px}
.volume{width:100%;margin-top:14px}
.empty{text-align:center;padding:40px 20px;color:var(--m)}
.empty .big{font-size:3rem;margin-bottom:12px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fd{animation:fade .3s ease}
</style>
</head>
<body>
<div id="app"></div>
<div class="bn"><div class="bni">
<button class="nv" data-r="/" onclick="nav('/')"><span class="i">🏠</span>خانه</button>
<button class="nv" data-r="/discover" onclick="nav('/discover')"><span class="i">🔍</span>کشف</button>
<button class="nv" data-r="/mood" onclick="nav('/mood')"><span class="i">🎧</span>حال من</button>
<button class="nv" data-r="/with" onclick="nav('/with')"><span class="i">👥</span>با دیگران</button>
<button class="nv" data-r="/me" onclick="nav('/me')"><span class="i">🪞</span>من</button>
</div></div>
<script>

// ============================================================
// PROFILES - سوالات داستانی برای خودشناسی
// ============================================================

const PROFILE_PATHS = {
  whoAmI: {
    id:'whoAmI', title:'من واقعاً چه جور آدمی‌ام؟', e:'🪞',
    qs:[
      {t:'فرض کن یک هفتهٔ خیلی شلوغ داشتی. جمعه شب ترجیح می‌دی…',o:[
        {l:'با چند نفر از دوستام بیرون برم',s:{extro:3,social:3}},
        {l:'با یک نفر که باهاش راحتم وقت بگذرونم',s:{intro:1,deep:3}},
        {l:'تنها باشم و برای خودم وقت داشته باشم',s:{intro:3,solo:3}},
        {l:'بستگی داره؛ اول ببینم حالم چطوره',s:{balanced:3}}]},
      {t:'وقتی با یک تصمیم سخت روبه‌رو می‌شی، معمولاً…',o:[
        {l:'لیست مزایا و معایب می‌سازم',s:{logic:3}},
        {l:'با خودم خلوت می‌کنم و به دلم گوش می‌دم',s:{intuition:3}},
        {l:'با یکی که بهش اعتماد دارم مشورت می‌کنم',s:{social:3}},
        {l:'عجله می‌کنم تا از بلاتکلیفی دربیام',s:{fast:3}}]},
      {t:'اگه یکی از نزدیکانت کاری کنه که ناراحتت کنه…',o:[
        {l:'مستقیم می‌گم ناراحت شدم',s:{direct:3}},
        {l:'سکوت می‌کنم و منتظر می‌مونم خودش بفهمه',s:{indirect:3}},
        {l:'مدتی فاصله می‌گیرم تا آروم شم',s:{distance:3}},
        {l:'سعی می‌کنم درکش کنم و ناراحتی‌ام رو رها کنم',s:{forgive:3}}]},
      {t:'کدوم جمله بیشتر شبیه توئه؟',o:[
        {l:'«باید همه‌چیز رو برنامه‌ریزی کنم.»',s:{structured:3}},
        {l:'«بذار ببینم چی پیش میاد.»',s:{spontaneous:3}},
        {l:'«حالم مهم‌تره.»',s:{emotional:3}},
        {l:'«بستگی به موقعیت داره.»',s:{flexible:3}}]}
    ],
    result: a => {
      if((a.intro||0) >= 3 && (a.deep||0) >= 3) return {type:'intro_deep', title:'آدم عمیق و درون‌نگر', desc:'تو از اون آدم‌هایی هستی که ترجیح می‌دی با یکی دو نفر واقعی وقت بگذرونی تا با جمع زیادی سطحی. روابط عمیق برات از تعداد مهم‌تره.', likes:['گفت‌وگوهای عمیق','وقت گذاشتن با یک نفر خاص','تنهایی و خلوت'], challenges:['گاهی ممکنه از موقعیت‌های اجتماعی فاصله بگیری','پیدا کردن کسی که مثل خودت عمیق باشه سخته'], tryNow:'این هفته یک بار توی یه جمع که معمولاً ازش فرار می‌کنی شرکت کن و ببین چه حسی داری.'};
      if((a.extro||0) >= 3 && (a.social||0) >= 3) return {type:'extro', title:'آدم اجتماعی و اهل ارتباط', desc:'تو از انرژی آدم‌ها می‌گیری. جمع دوستان برات مثل سوخت عمل می‌کنه.', likes:['جمع‌های دوستانه','آشنایی با آدم‌های جدید','فعالیت‌های گروهی'], challenges:['ممکنه تنهایی برات سنگین باشه','گاهی از درون خودت غافل می‌شی'], tryNow:'این هفته یه شب رو کامل تنها بگذرون و ببین چه چیزی از خودت کشف می‌کنی.'};
      if((a.logic||0) >= 3) return {type:'logical', title:'آدم منطقی و تحلیل‌گر', desc:'تو قبل از تصمیم، همه‌چیز رو می‌سنجی. این یه نقطه قوته، ولی گاهی می‌تونه جلوی عمل رو بگیره.', likes:['وضوح و نظم','تحلیل موقعیت‌ها','دقت در تصمیم'], challenges:['ممکنه در احساسات غرق نشی','گاهی دیر تصمیم می‌گیری'], tryNow:'یه تصمیم کوچیک رو فقط با احساست بگیر، بدون تحلیل.'};
      if((a.intuition||0) >= 3) return {type:'intuitive', title:'آدم شهودی و احساسی', desc:'تو به ندای درونت اعتماد می‌کنی و معمولاً حس درست رو می‌گیری.', likes:['آزادی انتخاب','تجربه‌های جدید','خلق لحظه‌ای'], challenges:['ممکنه تصمیم‌هات ناپایدار به نظر بیان','گاهی از استدلال غافل می‌شی'], tryNow:'یه تصمیم مهم رو این بار با لیست مزایا و معایب بگیر و مقایسه کن.'};
      return {type:'balanced', title:'آدم متعادل و انعطاف‌پذیر', desc:'تو بسته به موقعیت، خودت رو تطبیق می‌دی. این انعطاف یه مزیت بزرگه.', likes:['موقعیت‌های متنوع','تعادل بین تنهایی و جمع','استقلال در انتخاب'], challenges:['گاهی ممکنه از خودت مطمئن نباشی','انتخاب سخت‌تره چون همه گزینه‌ها جذاب‌ان'], tryNow:'یه بار یه تصمیم رو فقط بر اساس حس درونی و بدون تردید بگیر.'};
    }
  },
  values: {
    id:'values', title:'چه چیزهایی برام مهمه؟', e:'💎',
    qs:[
      {t:'اگر مجبور باشی از یکی از این‌ها بگذری، کدوم برات سخت‌تره؟',o:[
        {l:'آزادی‌ام',s:{freedom:3}},
        {l:'امنیت‌ام',s:{security:3}},
        {l:'روابط نزدیکم',s:{connection:3}},
        {l:'رشد شخصی‌ام',s:{growth:3}}]},
      {t:'موفقیت از نظر تو یعنی…',o:[
        {l:'رسیدن به اهداف مشخص',s:{achievement:3}},
        {l:'آرامش درونی',s:{peace:3}},
        {l:'تأثیر گذاشتن روی دیگران',s:{impact:3}},
        {l:'زندگی بدون پشیمانی',s:{authentic:3}}]},
      {t:'وقتی به آینده فکر می‌کنی، بیشتر چی برات مهمه؟',o:[
        {l:'ثبات مالی',s:{security:3}},
        {l:'کار معنادار',s:{meaning:3}},
        {l:'روابط گرم',s:{connection:3}},
        {l:'آزادی برای انتخاب سبک زندگی',s:{freedom:3}}]}
    ],
    result: a => {
      let top = Object.entries(a).sort((x,y)=>y[1]-x[1])[0][0];
      const map = {freedom:'آزادی',security:'امنیت',connection:'ارتباط',growth:'رشد',achievement:'دستاورد',peace:'آرامش',impact:'تأثیر',authentic:'اصالت',meaning:'معنا'};
      return {type:top, title:'ارزش اصلی تو: '+map[top], desc:'تو معمولاً تصمیم‌هات رو حول محور «'+map[top]+'» می‌گیری. این یعنی در لحظه‌های سخت، این ارزش راهنمای توئه.', likes:['موقعیت‌هایی که این ارزش رو تقویت می‌کنن'], challenges:['گاهی ممکنه بین این ارزش و نیازهای دیگه تضاد پیش بیاد'], tryNow:'این هفته یه تصمیم روزمره‌ات رو آگاهانه با این ارزش بسنج.'};
    }
  },
  relationships: {
    id:'relationships', title:'توی رابطه‌ها چطورم؟', e:'❤️',
    qs:[
      {t:'وقتی با یه نفر صمیمی می‌شی، معمولاً…',o:[
        {l:'همه‌چیز رو تعریف می‌کنم',s:{open:3}},
        {l:'کم‌کم باز می‌شم',s:{slow:3}},
        {l:'مرزهام رو حفظ می‌کنم',s:{boundary:3}}]},
      {t:'اگه کسی ازت انتقاد کنه…',o:[
        {l:'ناراحت می‌شم ولی می‌پذیرم',s:{open:3}},
        {l:'ممکنه دفاع کنم',s:{defensive:3}},
        {l:'به خودم شک می‌کنم',s:{selfdoubt:3}},
        {l:'می‌فهمم نظرشه، احساسی نمی‌گیرم',s:{secure:3}}]},
      {t:'توی رابطه بیشتر دنبال چی هستی؟',o:[
        {l:'فهمیده شدن',s:{seen:3}},
        {l:'امنیت عاطفی',s:{secure:3}},
        {l:'آزادی و استقلال',s:{independent:3}},
        {l:'رشد مشترک',s:{growth:3}}]}
    ],
    result: a => {
      if((a.secure||0)>=3) return {type:'secure', title:'سبک دلبستگی ایمن', desc:'تو توی روابط حس اعتماد داری و می‌تونی هم صمیمی باشی، هم مرزهات رو حفظ کنی.', likes:['روابط پایدار'], challenges:['گاهی ممکنه دیگران وابسته‌تر از تو باشن'], tryNow:'به یه رابطه‌ای که برات مهمه، این هفته یه وقت با کیفیت اختصاص بده.'};
      if((a.defensive||0)>=3) return {type:'anxious', title:'سبک دلبستگی مضطرب', desc:'گاهی نگران می‌شی که مبادا طرف مقابل فاصله بگیره. این واکنش طبیعی وقتی یه نیاز قدیمی دلبستگی فعال می‌شه.', likes:['شفافیت در رابطه'], challenges:['ممکنه بیش از حد تحلیل کنی'], tryNow:'دفعهٔ بعدی که حس کردی طرف مقابل سرد شده، قبل از هر واکنشی، ۱۰ دقیقه با خودت خلوت کن.'};
      if((a.selfdoubt||0)>=3) return {type:'avoidant', title:'سبک دلبستگی اجتنابی', desc:'تو معمولاً ترجیح می‌دی روی پای خودت وایسی و از وابستگی فاصله بگیری.', likes:['استقلال'], challenges:['ممکنه در درخواست کمک سخت باشی'], tryNow:'این هفته از یک نفر یه کمک کوچیک بخواه و ببین چه حسی داره.'};
      return {type:'mixed', title:'سبک دلبستگی ترکیبی', desc:'احساسات تو بسته به موقعیت و طرف مقابل تغییر می‌کنه. این یعنی انعطاف‌پذیری، ولی گاهی گیج‌کننده‌ست.', likes:['روابطی که فضا برای رشد بدن'], challenges:['ممکنه نتونی الگوی مشخصی برای خودت تعریف کنی'], tryNow:'به یک رابطهٔ اخیرت فکر کن و ببین کدوم سبک بیشتر ظاهر شده.'};
    }
  },
  energy: {
    id:'energy', title:'چی بهم انرژی می‌ده و چی خستگیم می‌کنه؟', e:'⚡',
    qs:[
      {t:'کدوم بیشتر بهت انرژی می‌ده؟',o:[
        {l:'یه گفت‌وگوی عمیق',s:{deep:3}},
        {l:'یه پروژهٔ خلاقانه',s:{creative:3}},
        {l:'یه پیاده‌روی طولانی',s:{body:3}},
        {l:'تنهایی و کتاب',s:{solo:3}}]},
      {t:'کدوم بیشتر خسته‌ات می‌کنه؟',o:[
        {l:'جمع‌های شلوغ',s:{social_drain:3}},
        {l:'کارهای تکراری',s:{routine_drain:3}},
        {l:'تصمیم‌های سریع',s:{decision_drain:3}},
        {l:'وقت‌گذرانی سطحی',s:{superficial_drain:3}}]},
      {t:'آخرین بار کی حس کردی «این لحظه رو دوست دارم»؟',o:[
        {l:'امروز',s:{present:3}},
        {l:'این هفته',s:{week:3}},
        {l:'یادم نمیاد',s:{disconnected:3}}]}

let audioCtx = null;
let audioNodes = [];
let currentTrack = null;

function stopAudio(){
  audioNodes.forEach(n=>{try{n.stop?n.stop():n.disconnect()}catch(e){}});
  audioNodes = [];
  currentTrack = null;
}

function playRain(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  stopAudio();
  const bufferSize = 2 * audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) output[i] = Math.random()*2-1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer; noise.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 800;
  const gain = audioCtx.createGain(); gain.gain.value = 0.15;
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start(); audioNodes.push(noise);
  currentTrack = 'rain';
}

function playWaves(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  stopAudio();
  const bufferSize = 2 * audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) output[i] = Math.random()*2-1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer; noise.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 500;
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.1;
  const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 250;
  lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
  const gain = audioCtx.createGain(); gain.gain.value = 0.15;
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  lfo.start(); noise.start(); audioNodes.push(noise, lfo);
  currentTrack = 'waves';
}

function playForest(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  stopAudio();
  const bufferSize = 2 * audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) output[i] = Math.random()*2-1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer; noise.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.value = 2000; filter.Q.value = 0.5;
  const gain = audioCtx.createGain(); gain.gain.value = 0.08;
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start(); audioNodes.push(noise);
  currentTrack = 'forest';
}

function playCalm(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  stopAudio();
  const notes = [220, 277.18, 329.63, 440];
  notes.forEach((f,i)=>{
    const osc = audioCtx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = f;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.04;
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.1 + i*0.05;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.02;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); lfo.start();
    audioNodes.push(osc, lfo);
  });
  currentTrack = 'calm';
}

function playLift(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  stopAudio();
  const notes = [261.63, 329.63, 392.00, 523.25];
  notes.forEach((f,i)=>{
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle'; osc.frequency.value = f;
    const gain = audioCtx.createGain(); gain.gain.value = 0.03;
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.2;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.015;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); lfo.start();
    audioNodes.push(osc, lfo);
  });
  currentTrack = 'lift';
}

function toggleTrack(name){
  if(currentTrack === name){ stopAudio(); return; }
  if(name === 'rain') playRain();
  else if(name === 'waves') playWaves();
  else if(name === 'forest') playForest();
  else if(name === 'calm') playCalm();
  else if(name === 'lift') playLift();
  render();
}

// HELPERS
// ============================================================

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function b64e(s){ try{ const b=new TextEncoder().encode(s); let r=''; b.forEach(x=>r+=String.fromCharCode(x)); return btoa(r).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }catch(e){ return ''; } }
function b64d(s){ try{ let x=s.replace(/-/g,'+').replace(/_/g,'/'); while(x.length%4) x+='='; const b=atob(x); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return new TextDecoder().decode(u); }catch(e){ return null; } }
function appUrl(){ return location.origin + location.pathname; }

async function share(t,x,u){
  try{
    if(navigator.share){ await navigator.share({title:t,text:x,url:u}); return true; }
    else if(navigator.clipboard){ await navigator.clipboard.writeText(u); alert('لینک کپی شد ✅'); return true; }
    else { prompt('کپی کن:', u); return true; }
  }catch(e){ return false; }
}

async function copyT(t){
  try{ await navigator.clipboard.writeText(t); alert('کپی شد ✅'); }
  catch(e){ prompt('کپی کن:', t); }
}

// ROUTER
// ============================================================

function nav(p){ if(location.hash === '#'+p) route(); else location.hash = p; }

function route(){
  const h = location.hash.slice(1) || '/';
  const parts = h.split('/').filter(Boolean);
  const [r, p] = parts;
  window.scrollTo(0,0);
  document.querySelectorAll('.nv').forEach(b=>{
    const rr = b.getAttribute('data-r');
    b.classList.toggle('a', rr === h || (rr !== '/' && h.startsWith(rr)));
  });
  switch(r){
    case undefined: return vHome();
    case 'discover': return vDiscover();
    case 'me': return vMe();
    case 'mood': return vMood();
    case 'with': return vWithOthers();
    case 'profile': return vProfileList();
    case 'profile-run': return vProfileRun(p);
    case 'profile-result': return vProfileResult(p);
    case 'state': return vStateList();
    case 'state-run': return vStateRun(p);
    case 'state-result': return vStateResult(p);
    case 'skills': return vSkills();
    case 'skill': return vSkill(p);
    case 'tests': return vTestsList();
    case 'test': return vTestIntro(p);
    case 'test-run': return vTestRun(p);
    case 'test-result': return vTestResult(p);
    case 'situation': return vSituation();
    case 'music': return vMusic();
    case 'film': return vFilmIntro();
    case 'film-result': return vFilmResult();
    case 'book': return vBookIntro();
    case 'book-result': return vBookResult();
    case 'emergency': return vEmergency();
    case 'hist': return vHist();
    case 'about': return vAbout();
    case 'quiz': return p ? vQuizTake(p) : vQuizCreate();
    case 'quiz-create': return vQuizCreate();
    default: return vHome();
  }
}

const SIT_STEPS = [
  {key:'event', q:'چه اتفاقی افتاد؟', hint:'فقط واقعیت‌ها رو بنویس، بدون تفسیر.', multiline:true},
  {key:'you', q:'تو چی گفتی؟', hint:'اگه چیزی نگفتی، همین رو بنویس.', multiline:true},
  {key:'them', q:'طرف مقابل چی گفت یا چه کار کرد؟', hint:'دقیقاً چی شد؟', multiline:true},
  {key:'feel', q:'اون لحظه چه حسی داشتی؟', hint:'حتی اگه مبهمه، سعی کن اسمش رو پیدا کنی.', multiline:true},
  {key:'want', q:'الان بیشتر دنبال چی هستی؟', opts:['بفهمم حق با کی بوده','بفهمم چرا اینقدر ناراحت شدم','بدونم چی جواب بدم','رابطه‌مون رو بهتر کنم','فقط می‌خوام یکی کمکم کنه موضوع رو مرتب کنم']}
];

function vSituation(){
  ST.situation = {step:0, data:{}};
  renderSituation();
}

function renderSituation(){
  const step = ST.situation.step;
  const s = SIT_STEPS[step];
  const prog = (step / SIT_STEPS.length) * 100;

  let content = `
    <button class="back" onclick="nav('/')">← بازگشت</button>
    <div class="pg"><div class="pgb" style="width:${prog}%"></div></div>
    <p class="qn">قدم ${step+1} از ${SIT_STEPS.length}</p>
    <p class="q">${esc(s.q)}</p>
    <p class="m" style="margin-bottom:14px">${esc(s.hint||'')}</p>
  `;

  if(s.multiline){
    content += `<textarea class="ta" id="sit-input" placeholder="بنویس…">${esc(ST.situation.data[s.key]||'')}</textarea>
      <button class="btn bp" onclick="nextSit()">ادامه</button>`;
  } else {
    content += `<div class="opts">${s.opts.map((o,i)=>`<button class="opt" onclick="pickSit(${i})">${esc(o)}</button>`).join('')}</div>`;
  }

  document.getElementById('app').innerHTML = content;
  window.scrollTo(0,0);
}

function nextSit(){
  const step = ST.situation.step;
  const s = SIT_STEPS[step];
  const val = document.getElementById('sit-input')?.value.trim();
  if(!val) { alert('یه چیزی بنویس'); return; }
  ST.situation.data[s.key] = val;
  ST.situation.step++;
  if(ST.situation.step >= SIT_STEPS.length) showSitResult();
  else renderSituation();
}

function pickSit(oi){
  const step = ST.situation.step;
  const s = SIT_STEPS[step];
  ST.situation.data[s.key] = s.opts[oi];
  ST.situation.step++;
  if(ST.situation.step >= SIT_STEPS.length) showSitResult();
  else renderSituation();
}

    <p class="m" style="margin-bottom:16px">به ۵ سؤال دربارهٔ خودت جواب بده، لینک بساز، بفرست.</p>

      <p style="font-weight:600;margin-bottom:8px">اسم تو</p>
      <input id="qn" style="width:100%;padding:12px;background:var(--s2);border:1px solid var(--b);border-radius:10px;color:var(--t);font-family:inherit" placeholder="مثلاً: علی" maxlength="20">
    </div>

  `;
  const shuffled = [...QUIZ_BANK].sort(()=>Math.random()-0.5).slice(0,5);
  ST.qD = {name:'', picks:shuffled, ans:new Array(5).fill(null)};

function renderQuizPicker(){
  const c = document.getElementById('qpk');
  if(!c) return;
  c.innerHTML = ST.qD.picks.map((p,i)=>`
    <div class="card">
      <p style="font-size:.95rem;font-weight:600;margin-bottom:10px">${i+1}. ${esc(p.q)}</p>
      <div class="opts" style="gap:6px">
        ${p.o.map((o,oi)=>`<button class="opt ${ST.qD.ans[i]===oi?'sel':''}" style="padding:10px 14px;font-size:.85rem" onclick="pickQuiz(${i},${oi})">${esc(o)}</button>`).join('')}
      </div>
    </div>
  `).join('');
  const all = ST.qD.ans.every(a=>a!==null);
  const btn = document.getElementById('qcb');
  if(btn) btn.disabled = !all;
}

function pickQuiz(qi, oi){ ST.qD.ans[qi] = oi; renderQuizPicker(); }

async function subQC(){
  const name = document.getElementById('qn')?.value.trim() || 'یک دوست';
  const picks = ST.qD.picks.map(p => QUIZ_BANK.indexOf(p));
  const data = {n:name, q:picks, a:ST.qD.ans};
  const enc = b64e(JSON.stringify(data));
  const url = appUrl() + '#/quiz/' + enc;

  document.getElementById('app').innerHTML = `
    <button class="back" onclick="nav('/quiz-create')">← ساخت جدید</button>
    <h1>✅ لینک ساخته شد</h1>
    <p class="m">این لینک رو برای دوستت بفرست:</p>
    <div style="display:flex;gap:8px;margin:10px 0">
      <input readonly value="${esc(url)}" style="flex:1;padding:12px;background:var(--s2);border:1px solid var(--b);border-radius:10px;color:var(--t);font-size:.78rem;direction:ltr">
      <button onclick="copyT('${esc(url)}')" style="padding:0 16px;background:var(--p);color:#0B1220;border:none;border-radius:10px;font-weight:700">کپی</button>
    </div>
    <button class="btn bp" onclick="share('چقدر منو می‌شناسی؟','بیا ببینم چقدر منو می‌شناسی 👀','${esc(url)}')">📤 اشتراک‌گذاری</button>
  `;
  window.scrollTo(0,0);
}

function vQuizTake(enc){
  const d = b64d(enc);
  let data;
  try{ data = JSON.parse(d); }catch(e){ data = null; }
  if(!data || !data.q || !data.a){
    document.getElementById('app').innerHTML = `<button class="back" onclick="nav('/')">← بازگشت</button><div class="empty"><p>🔗 لینک نامعتبر است.</p></div>`;
    return;
  }
  ST.qA = new Array(data.q.length).fill(null);
  ST.qDc = data;
  renderQuizTake();
}

function renderQuizTake(){
  const d = ST.qDc;
  document.getElementById('app').innerHTML = `
    <button class="back" onclick="nav('/')">← بازگشت</button>
    <div class="card fd">
      <h1 style="font-size:1.2rem">👥 ${esc(d.n)} را چقدر می‌شناسی؟</h1>
      <p class="m">${d.q.length} سؤال کوتاه. با حس اولت جواب بده.</p>
    </div>
    ${d.q.map((bi,i)=>{
      const it = QUIZ_BANK[bi];
      if(!it) return '';
      return `<div class="card">
        <p style="font-size:.95rem;font-weight:600;margin-bottom:10px">${i+1}. ${esc(it.q)}</p>
        <div class="opts" style="gap:6px">
          ${it.o.map((o,oi)=>`<button class="opt ${ST.qA[i]===oi?'sel':''}" style="padding:10px 14px;font-size:.85rem" onclick="ansQTake(${i},${oi})">${esc(o)}</button>`).join('')}
        </div>
      </div>`;
    }).join('')}
    <button class="btn bp" onclick="subQTake()" ${ST.qA.some(a=>a===null)?'disabled':''}>${ST.qA.some(a=>a===null)?'پاسخ به همه':'مشاهدهٔ نتیجه'}</button>
  `;
}

function ansQTake(qi, oi){ ST.qA[qi] = oi; renderQuizTake(); }

function subQTake(){
  const d = ST.qDc;
  let cor = 0;
  const rows = d.q.map((bi,i)=>{
    const ok = ST.qA[i] === d.a[i];
    if(ok) cor++;
    return {bi, ma:ST.qA[i], ta:d.a[i], ok};
  });
  const tot = d.q.length;
  const pct = Math.round((cor/tot)*100);
  let msg;
  if(pct === 100) msg = '🏆 عالی! واقعاً منو می‌شناسی.';
  else if(pct >= 80) msg = '😍 خیلی خوب! تقریباً کامل.';
  else if(pct >= 60) msg = '😊 بد نیست، ولی چیزهایی هست که نمی‌دونی.';
  else if(pct >= 40) msg = '🤔 نصفه‌ونیمه. یه‌کم بیشتر با هم وقت بگذرونیم.';
  else msg = '😅 انگار هنوز منو نمی‌شناسی. فرصت خوبیه که بیشتر با هم حرف بزنیم.';

  document.getElementById('app').innerHTML = `
    <button class="back" onclick="nav('/')">← بازگشت</button>
    <div class="sh fd"><div class="n">${cor}/${tot}</div><div class="l">${pct}٪</div></div>
    <div class="card"><p style="font-weight:600">${msg}</p></div>
    <h3 style="margin-top:20px">جزئیات</h3>
    ${rows.map(r=>{
      const it = QUIZ_BANK[r.bi];
      if(!it) return '';
      return `<div class="card" style="border-color:${r.ok?'rgba(16,185,129,.4)':'rgba(239,68,68,.4)'}">
        <p style="font-weight:600;font-size:.9rem;margin-bottom:6px">${r.ok?'✅':'❌'} ${esc(it.q)}</p>
        <p class="m">انتخاب تو: ${esc(it.o[r.ma] || '-')}</p>
        ${!r.ok ? `<p class="m">انتخاب درست: ${esc(it.o[r.ta])}</p>` : ''}
      </div>`;
    }).join('')}
    <div class="dis">این بازی می‌تونه شروع یه گفت‌وگوی واقعی باشه. تفاوت‌ها رو با هم بررسی کنید.</div>
    <button class="btn bp" onclick="nav('/quiz-create')">ساخت بازی خودم</button>
    <button class="btn bs" onclick="nav('/')">بازگشت</button>
  `;
  window.scrollTo(0,0);
}
