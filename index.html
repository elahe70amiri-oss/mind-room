function loadHist(){try{ST.hist=JSON.parse(localStorage.getItem('mr_hist')||'[]')}catch(e){ST.hist=[]}}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function b64e(s){try{const b=new TextEncoder().encode(s);let r='';b.forEach(x=>r+=String.fromCharCode(x));return btoa(r).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){return''}}
function b64d(s){try{let x=s.replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';const b=atob(x);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}catch(e){return null}}
function appUrl(){return location.origin+location.pathname}
async function share(t,x,u){try{if(navigator.share){await navigator.share({title:t,text:x,url:u});return true}else if(navigator.clipboard){await navigator.clipboard.writeText(u);alert('لینک کپی شد ✅');return true}else{prompt('کپی کن:',u);return true}}catch(e){return false}}
async function copyT(t){try{await navigator.clipboard.writeText(t);alert('کپی شد ✅')}catch(e){prompt('کپی کن:',t)}}

function nav(p){if(location.hash==='#'+p)route();else location.hash=p}
function route(){
  const h=location.hash.slice(1)||'/';
  const parts=h.split('/').filter(Boolean);
  const [r,p]=parts;
  window.scrollTo(0,0);
  document.querySelectorAll('.nv').forEach(b=>{const rr=b.getAttribute('data-r');b.classList.toggle('a',rr===h||(rr!=='/'&&h.startsWith(rr)))});
  switch(r){
    case undefined:return vHome();
    case 'tests':return vTests();
    case 'test':return vTestIntro(p);
    case 'trun':return vTestRun(p);
    case 'tres':return vTestRes(p);
    case 'paths':return vPaths();
    case 'path':return vPathIntro(p);
    case 'prun':return vPathRun(p);
    case 'pres':return vPathRes(p);
    case 'enc':return vEnc();
    case 'entry':return vEntry(p);
    case 'skills':return vSkills();
    case 'skill':return vSkill(p);
    case 'lib':return vLib(p||'books');
    case 'quiz':return p?vQuizTake(p):vQuizCreate();

function subT(){
  const t=ST.aT;let s=0;
  t.qs.forEach((_,i)=>{let v=t.opts[ST.aTA[i]].v;if(t.rv&&t.rv.includes(i)){const mx=Math.max(...t.opts.map(o=>o.v));const mn=Math.min(...t.opts.map(o=>o.v));v=(mx+mn)-v}s+=v});
  if(t.mult)s*=t.mult;
  let crit=false;
  if(t.crit!==undefined){const o=t.opts[ST.aTA[t.crit]];if(o&&o.v>0)crit=true}
  const rg=t.rs.find(r=>s<=r.m)||t.rs[t.rs.length-1];
  saveHist({type:'test',id:t.id,title:t.name,score:s,label:rg.l});
  ST.last={type:'test',id:t.id,s,rg,crit};
  nav('/tres/'+t.id);
}

  const d=b64d(enc);let data;
  try{data=JSON.parse(d)}catch(e){data=null}
  if(!data||!data.q||!data.a){document.getElementById('app').innerHTML=`<button class="back" onclick="nav('/')">← بازگشت</button><div class="empty"><p>🔗 لینک نامعتبر است.</p></div>`;return}
  ST.qA=new Array(data.q.length).fill(null);ST.qDc=data;
  rQTS();
}

function rQTS(){
  const d=ST.qDc;
  document.getElementById('app').innerHTML=`<button class="back" onclick="nav('/')">← بازگشت</button>
    <div class="card"><h1 style="font-size:1.3rem">👥 ${esc(d.n)} را چقدر می‌شناسی؟</h1><p class="m">به ${d.q.length} سؤال جواب بده.</p></div>
    ${d.q.map((bi,i)=>{const it=QB[bi];if(!it)return '';return `<div class="card"><p style="font-size:.95rem;font-weight:600;margin-bottom:10px">${i+1}. ${esc(it.q)}</p><div class="opts" style="gap:6px">${it.o.map((o,oi)=>`<button class="opt ${ST.qA[i]===oi?'sel':''}" style="padding:10px 14px;font-size:.85rem" onclick="ansQT(${i},${oi})">${esc(o)}</button>`).join('')}</div></div>`}).join('')}
    <button class="btn bp" onclick="subQT()" ${ST.qA.some(a=>a===null)?'disabled':''}>${ST.qA.some(a=>a===null)?'پاسخ به همه':'مشاهدهٔ نتیجه'}</button>`;
}

function ansQT(qi,oi){ST.qA[qi]=oi;rQTS()}

function subQT(){
  const d=ST.qDc;let cor=0;
  const rs=d.q.map((bi,i)=>{const ok=ST.qA[i]===d.a[i];if(ok)cor++;return{bi,ma:ST.qA[i],ta:d.a[i],ok}});
  const tot=d.q.length,pct=Math.round((cor/tot)*100);
  let m;pct===100?m='🏆 عالی!':pct>=80?m='😍 خیلی خوب!':pct>=60?m='😊 بد نیست!':pct>=40?m='🤔 نصفه‌ونیمه!':m='😅 هنوز منو نمی‌شناسی!';
  document.getElementById('app').innerHTML=`<button class="back" onclick="nav('/')">← بازگشت</button>
    <div class="sh"><div class="n">${cor}/${tot}</div><div class="l">${pct}٪</div></div>
    <div class="card"><p style="font-weight:600">${m}</p></div>
    ${rs.map(r=>{const it=QB[r.bi];if(!it)return '';return `<div class="card" style="border-color:${r.ok?'rgba(16,185,129,.4)':'rgba(239,68,68,.4)'}"><p style="font-weight:600;font-size:.9rem;margin-bottom:6px">${r.ok?'✅':'❌'} ${esc(it.q)}</p><p class="m">پاسخ تو: ${esc(it.o[r.ma]||'-')}</p>${!r.ok?`<p class="m">درست: ${esc(it.o[r.ta])}</p>`:''}</div>`}).join('')}
    <button class="btn bp" onclick="nav('/quiz')">ساخت بازی خودم</button><button class="btn bs" onclick="nav('/')">بازگشت</button>`;
  window.scrollTo(0,0);
}

function vEmergency(){
  document.getElementById('app').innerHTML=`<button class="back" onclick="nav('/')">← بازگشت</button>
    <h1 style="color:#F87171">🆘 الان حالم خوب نیست</h1>
    <div class="warn" style="margin-bottom:14px"><strong>اگر در خطر فوری هستی، همین الان تماس بگیر:</strong><br>☎️ اورژانس اجتماعی: <strong>۱۲۳</strong><br>☎️ صدای مشاور: <strong>۱۴۸۰</strong><br>☎️ اورژانس پزشکی: <strong>۱۱۵</strong></div>
    <div class="card"><h3>قدم ۱: تنفس ۴-۷-۸</h3><p>۴ ثانیه دم، ۷ ثانیه نگه‌دار، ۸ ثانیه بازدم. سه بار.</p></div>
    <div class="card"><h3>قدم ۲: تکنیک ۵-۴-۳-۲-۱</h3><p>۵ چیز می‌بینی، ۴ چیز لمس می‌کنی، ۳ چیز می‌شنوی، ۲ چیز بو می‌کنی، ۱ چیز می‌چشی.</p></div>
    <div class="card"><h3>قدم ۳: آب سرد</h3><p>صورتت را با آب سرد بشور.</p></div>
    <div class="card"><h3>قدم ۴: با یک نفر حرف بزن</h3><p>با یک دوست یا خط مشاوره تماس بگیر.</p></div>
    <div class="dis" style="margin-top:16px">این اپ جایگزین خدمات فوریتی نیست.</div>`;
}

function vHist(){
  if(!ST.hist.length){document.getElementById('app').innerHTML=`<button class="back" onclick="nav('/')">← بازگشت</button><h1>📈 تاریخچه</h1><div class="empty"><p>📭 هنوز چیزی ثبت نکرده‌ای.</p></div>`;return}
  const tc=ST.hist.filter(h=>h.type==='test').length,pc=ST.hist.filter(h=>h.type==='path').length;
  let h=`<button class="back" onclick="nav('/')">← بازگشت</button><h1>📈 تاریخچه</h1>
    <div class="sr"><div class="stat"><div class="n">${tc}</div><div class="t">تست</div></div><div class="stat"><div class="n">${pc}</div><div class="t">مسیر</div></div><div class="stat"><div class="n">${ST.hist.length}</div><div class="t">کل</div></div></div>
    <h3 style="margin-top:16px">آخرین فعالیت‌ها</h3>`;
  [...ST.hist].reverse().forEach(x=>{
    const dt=new Date(x.ts).toLocaleDateString('fa-IR')+' '+new Date(x.ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
    if(x.type==='test')h+=`<div class="card"><h4>🧪 ${esc(x.title)}</h4><p class="m">${dt}</p><p style="margin-top:6px">نمره: <strong>${x.score}</strong> — ${esc(x.label)}</p></div>`;
    else h+=`<div class="card"><h4>🧭 ${esc(x.title)}</h4><p class="m">${dt}</p><p style="margin-top:6px">سطح: ${x.severity==='high'?'نیاز به پیگیری':x.severity==='medium'?'نیاز به توجه':'قابل مدیریت'}</p></div>`;
  });
  h+=`<button class="btn bs" onclick="if(confirm('پاک شود؟')){ST.hist=[];localStorage.removeItem('mr_hist');vHist()}">🗑️ پاک کردن</button>`;
  document.getElementById('app').innerHTML=h;
}
